<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR Policy Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="icon" href="./HR_logo.png">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M16 7.5a6 6 0 1 0 0 9"/></svg>
      </span>
      <span class="brand-name">HR Assistant</span>
    </div>
    <div class="status" id="status" title="Checking API…">
      <span class="status-dot"></span>
      <span class="status-text">Connecting…</span>
    </div>
  </header>
 
  <main class="chat" id="chat" aria-live="polite">
    <section class="welcome" id="welcome">
      <h1>Ask about the HR policy</h1>
      <p>Answers come only from the policy document. Try one of these:</p>
      <div class="suggestions">
        <button type="button" class="chip">How many casual leaves do I get per year?</button>
        <button type="button" class="chip">How long is the probation period?</button>
        <button type="button" class="chip">What is the notice period for resignation?</button>
      </div>
    </section>
  </main>
 
  <footer class="composer-wrap">
    <form class="composer" id="composer" autocomplete="off">
      <textarea id="input" rows="1" placeholder="Message HR Assistant…" aria-label="Your question"></textarea>
      <div class="composer-bar">
        <div class="tools">
          <button type="button" class="tool" id="sourcesToggle" aria-pressed="true" title="Show sources with answers">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7.5A2.5 2.5 0 0 0 5 5.5v13A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>
          </button>
          <label class="tool tool-topk" title="Number of document chunks to search (top_k)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
            <select id="topK" aria-label="top_k"></select>
          </label>
          <button type="button" class="tool" id="clearChat" title="New chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h8"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          </button>
        </div>
        <button type="submit" class="send" id="send" aria-label="Send" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </form>
    <p class="hint">Enter to send · Shift + Enter for a new line</p>
  </footer>
 
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
